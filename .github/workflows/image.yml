name: build image

# 只有打 tag（v*）或手动触发时才构建，普通提交不烧 Actions 时间。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      base_image:
        description: '上游基础镜像'
        required: false
        default: 'ghcr.io/schlagmichdoch/pairdrop:latest'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: 安装 QEMU（跨架构构建 arm64 需要）
        uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=short

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # 上游基础镜像同时提供 amd64 与 arm64；两种架构都出，Oracle 的 Ampere(A1) 实例也能用。
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ inputs.base_image || 'ghcr.io/schlagmichdoch/pairdrop:latest' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 校验镜像里确实带上了定制文件
        run: |
          IMG=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          echo "== 已发布的架构 =="
          docker buildx imagetools inspect "$IMG" | grep -E 'Platform:' || true
          docker pull "$IMG"
          docker run --rm --entrypoint sh "$IMG" -c \
            'grep -q "patched" public/scripts/network.js && grep -q "transfer-status-dialog" public/index.html && grep -q "apple-theme" public/service-worker.js && echo custom-files-ok'
