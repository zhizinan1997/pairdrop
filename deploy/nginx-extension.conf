# file.zhizinan.top（PairDrop）专用，2026-10-18。部署位置：/www/server/panel/vhost/nginx/extension/file.zhizinan.top/pairdrop.conf
# EdgeOne 把真实客户端 IP 放在 EO-Connecting-IP 里；PairDrop 按来源 IP 把同一网络的设备互相配对，
# 不换成真实 IP 的话所有人都会被看成同一个网络（同 s2a 的做法）。
set_real_ip_from 0.0.0.0/0;
set_real_ip_from ::/0;
real_ip_header EO-Connecting-IP;
